server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    # resolver + переменная: nginx перечитывает DNS бэкенда, а не запоминает
    # его адрес на старте — иначе после пересборки контейнера ловим 502.
    resolver 127.0.0.11 valid=10s;

    location /api/v1/auth/ {
        set $auth_upstream http://price-api:8000;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        set $fsa_upstream http://fsa-api:8100;
        proxy_pass $fsa_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Интерфейс отдаётся и с корня, и из-под /fsa/: снаружи он живёт под
    # префиксом, а прямое обращение к контейнеру идёт по корню.
    location /fsa/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /fsa/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
